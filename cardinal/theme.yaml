slug: cardinal
name: Cardinal
version: 3.3.4
author:
  name: SeanBlog Frame
description: 高自由度可配置主题，Aurora/Lazzaro 风格。侧边栏、列表样式、Hero、字体、色彩模式、圆角、阴影、毛玻璃、代码块等全量自定义。
engine: seanblog-theme
engineVersion: 2
base: seanblog-default
assets:
  css: assets/theme.css
  js: assets/js/main.js
settingsSchema:
  布局结构:
    顶栏:
      - key: showTopBar
        label: 显示顶部栏
        type: boolean
        default: true
        description: 关闭后品牌和导航移入侧边栏
      - key: showSiteName
        label: 显示站点名称
        type: boolean
        default: true
        if: "showTopBar === true"
      - key: showSearch
        label: 显示搜索按钮
        type: boolean
        default: true
        if: "showTopBar === true"
      - key: searchPosition
        label: 搜索按钮位置
        type: select
        default: right-side
        if: "showSearch === true"
        options:
          - { label: 跟随菜单项, value: follow-menu }
          - { label: 右侧固定, value: right-side }
      - key: navAlignment
        label: 菜单项对齐
        type: select
        default: right
        if: "showTopBar === true"
        options:
          - { label: 左侧, value: left }
          - { label: 居中, value: center }
          - { label: 右侧, value: right }
      - key: navItems
        label: 菜单项
        type: list
        default:
          - { link: /, label: 首页 }
          - { link: /categories, label: 分类 }
          - { link: /tags, label: 标签 }
        if: "showTopBar === true"
        description: 链接与名称均可改；名称支持图标，如 <i class="fa-solid fa-house"></i> 首页
        itemFields:
          - { key: link, label: 链接, type: text }
          - { key: label, label: 名称, type: text }
      - key: headerBehavior
        label: 顶部栏行为
        type: select
        default: fixed-always
        if: "showTopBar === true"
        options:
          - { label: 始终固定, value: fixed-always }
          - { label: 滚动隐藏, value: collapse-on-scroll }
          - { label: 仅顶部, value: static }
    侧边栏:
      - key: sidebarPosition
        label: 侧边栏位置
        type: select
        default: right
        options:
          - { label: 无, value: none }
          - { label: 左侧, value: left }
          - { label: 右侧, value: right }
      - key: sidebarSticky
        label: 侧边栏固定
        type: select
        default: sticky
        if: "sidebarPosition !== 'none'"
        options:
          - { label: 不固定, value: static }
          - { label: 滚动吸顶, value: sticky }
          - { label: 全屏固定, value: fixed }
      - key: sidebarContent
        label: 侧边栏内容
        type: multiselect
        default: ["profile", "tags"]
        if: "sidebarPosition !== 'none'"
        options:
          - { label: 个人简介, value: profile }
          - { label: 标签云, value: tags }
          - { label: 分类列表, value: categories }
      - key: profileAvatar
        label: 个人简介头像
        type: text
        default: ""
        if: "'profile' in sidebarContent"
        description: http(s):// 外链或 / 开头的本地路径；留空则不显示
      - key: profileAvatarRadius
        label: 头像圆角
        type: range
        default: 50
        min: 0
        max: 50
        step: 1
        if: "'profile' in sidebarContent"
        description: 0=方形，50=圆形
      - key: profileSignature
        label: 个人简介签名
        type: text
        default: ""
        if: "'profile' in sidebarContent"
      - key: profileCustomHtml
        label: 个人简介自定义HTML
        type: textarea
        default: ""
        if: "'profile' in sidebarContent"
        description: 追加到个人简介末尾，支持任意 HTML
      - key: sidebarTagsLimit
        label: 标签云显示数量
        type: number
        default: 10
        if: "'tags' in sidebarContent"
        description: 超出部分通过「更多」弹窗查看
      - key: sidebarCategoriesLimit
        label: 分类列表显示数量
        type: number
        default: 10
        if: "'categories' in sidebarContent"
        description: 超出部分通过「更多」弹窗查看
    内容区:
      - key: contentWidth
        label: 内容宽度
        type: select
        default: medium
        options:
          - { label: 窄 (48rem), value: narrow }
          - { label: 中 (60rem), value: medium }
          - { label: 宽 (72rem), value: wide }
      - key: articleListStyle
        label: 文章列表样式
        type: select
        default: list
        options:
          - { label: 文字列表, value: list }
          - { label: 卡片网格, value: cards }
      - key: listSeparator
        label: 列表分隔方式
        type: select
        default: border
        if: "articleListStyle === 'list'"
        options:
          - { label: 底线分隔, value: border }
          - { label: 间距分隔, value: gap }
          - { label: 卡片包裹, value: card }
    首页 Hero:
      - key: showHeroSection
        label: 首页 Hero 区
        type: boolean
        default: true
      - key: heroStyle
        label: Hero 区样式
        type: select
        default: minimal
        if: "showHeroSection === true"
        options:
          - { label: 居中极简, value: minimal }
          - { label: 渐变横幅, value: banner }
          - { label: 全屏封面, value: fullscreen }
      - key: showPinned
        label: 置顶文章区
        type: boolean
        default: true
        description: 首页顶部单独展示置顶文章；关闭则置顶文章按顺序混入最新列表
  视觉风格:
    色彩:
      - key: colorMode
        label: 色彩模式
        type: select
        default: dark
        options:
          - { label: 深色, value: dark }
          - { label: 浅色, value: light }
          - { label: 跟随系统, value: auto }
      - key: showThemeToggle
        label: 前台色彩切换按钮
        type: boolean
        default: true
        if: "showTopBar === true"
      - key: accentColor
        label: 强调色
        type: color
        default: "#cf829e"
        cssVariable: --color-accent
    字体:
      - key: fontFamily
        label: 正文字体
        type: select
        default: monospace
        options:
          - { label: 等宽, value: monospace }
          - { label: 无衬线, value: sans }
          - { label: 衬线, value: serif }
      - key: headingFontFamily
        label: 标题字体
        type: select
        default: same
        options:
          - { label: 跟随正文, value: same }
          - { label: 等宽, value: monospace }
          - { label: 无衬线, value: sans }
          - { label: 衬线, value: serif }
    形态:
      - key: borderRadius
        label: 圆角大小
        type: select
        default: small
        options:
          - { label: 无, value: none }
          - { label: 小, value: small }
          - { label: 中, value: medium }
          - { label: 大, value: large }
      - key: shadowStyle
        label: 阴影样式
        type: select
        default: none
        options:
          - { label: 无, value: none }
          - { label: 浅, value: light }
          - { label: 深, value: deep }
      - key: headerBlur
        label: 顶栏毛玻璃
        type: boolean
        default: true
        if: "showTopBar === true"
      - key: articleHeadingStyle
        label: 文章标题装饰
        type: select
        default: default
        options:
          - { label: 默认下划线, value: default }
          - { label: 彩色下划线, value: underline }
          - { label: 左侧竖条, value: bar-left }
    代码块:
      - key: codeBlockTheme
        label: 代码块配色
        type: select
        default: one-dark
        options:
          - { label: One Dark, value: one-dark }
          - { label: GitHub Dark, value: github-dark }
          - { label: GitHub Light, value: github-light }
          - { label: Nord, value: nord }
          - { label: Dracula, value: dracula }
      - key: showCodeLineNumbers
        label: 代码块行号
        type: boolean
        default: true
  文章详情:
    - key: showPostToc
      label: 文章目录侧栏
      type: boolean
      default: true
      description: 文章详情页独立显示目录侧栏（滚动吸顶+容器内滚动）；关闭则跟随首页侧栏设置
    - key: articleNavOrder
      label: 上下篇排序依据
      type: select
      default: publishedAt
      options:
        - { label: 发布时间, value: publishedAt }
        - { label: 更新时间, value: updatedAt }
    - key: articleMetaItems
      label: 文章元信息
      type: multiselect
      default: ["publishedAt", "viewCount", "category", "tags"]
      options:
        - { label: 发布时间, value: publishedAt }
        - { label: 修改时间, value: updatedAt }
        - { label: 浏览量, value: viewCount }
        - { label: 评论数, value: commentCount }
        - { label: 分类, value: category }
        - { label: 标签, value: tags }
    - key: showReadingTime
      label: 显示阅读时间
      type: boolean
      default: true
    - key: showArticleNav
      label: 上下篇导航
      type: boolean
      default: true
  页脚浮动:
    - key: showBackToTop
      label: 返回顶部按钮
      type: boolean
      default: true
    - key: showCommentJumpButton
      label: 跳转评论按钮
      type: boolean
      default: false
